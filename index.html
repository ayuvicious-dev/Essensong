<style>
:root{color-scheme:light;--ink:#2a1f45;--sub:#7d7099;--vio:#9b7fe0;--vio2:#7f5fd0;--lav:#d9c9f5;--mist:#f6f2fd;--card:#fff;--line:#e6dcf7;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--ink:#efe9fb;--sub:#a79cc4;--lav:#4a3a78;--mist:#17112b;--card:#221a3d;--line:#352a58}}
:root[data-theme=dark]{color-scheme:dark;--ink:#efe9fb;--sub:#a79cc4;--lav:#4a3a78;--mist:#17112b;--card:#221a3d;--line:#352a58}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--mist);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
input{font:inherit;color:inherit}
.hide{display:none!important}
#auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
#auth img{width:150px}
#auth h1{font-size:1.9rem;letter-spacing:-.02em}
#auth p.s{color:var(--sub);font-size:.95rem;text-align:center;max-width:280px}
.f{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.f input,.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.btn{padding:13px 16px;border-radius:14px;font-weight:600;background:var(--vio);color:#fff}
.btn:active{background:var(--vio2)}
.btn.o{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.lnk{color:var(--vio2);font-size:.9rem;text-align:center}
#err{color:var(--bad);font-size:.9rem;min-height:1.2em;text-align:center;max-width:300px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px}
header img{width:42px}
header h1{font-size:0;flex:1;overflow:hidden}
.chip{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--lav);color:var(--ink)}
.bar{display:flex;gap:8px;padding:0 18px 10px}
.bar .btn{white-space:nowrap}
#list{flex:1;overflow:auto;padding:0 12px 12px}
.row{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:14px}
.row.on{background:var(--lav)}
.row .m{flex:1;min-width:0;text-align:left;padding:4px 6px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ic.ok{color:var(--vio2)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--sub);padding:48px 24px;line-height:1.5}
#pl{background:var(--card);border-top:1.5px solid var(--line);padding:12px 18px 10px;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(127,95,208,.12)}
#pl .n{text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pl .ar{text-align:center;font-size:.85rem;color:var(--sub);min-height:1.2em;margin-bottom:6px}
.sk{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--sub)}
input[type=range]{flex:1;accent-color:var(--vio)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px;padding:0 2px}
.ct .ic{color:var(--ink)}.ct .ic.act{color:var(--vio2)}
#pp{position:relative;width:84px;height:84px;margin:0 6px}
#pp .c{position:absolute;inset:12px;border-radius:50%;background:var(--vio);display:grid;place-items:center;color:#fff}
#pp .c svg{width:26px;height:26px;fill:#fff}
#pp .w{position:absolute;top:50%;width:14px;height:34px;margin-top:-17px;border:4px solid var(--lav);border-bottom:0;border-left:0;border-radius:0 40px 40px 0;opacity:.6}
#pp .w.l{left:-2px;transform:scaleX(-1)}#pp .w.r{right:-2px}
.playing #pp .w{animation:pu 1.1s ease-in-out infinite alternate}
.playing #pp .w.r{animation-delay:.3s}
@keyframes pu{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.playing #pp .w{animation:none}}
.sec{display:flex;align-items:center;gap:6px;padding:2px 6px 8px}.sec b{flex:1;font-size:1.05rem}.sec span{font-size:.8rem;color:var(--sub)}
.row .m.fl{display:flex;align-items:center;gap:12px}.fl svg{width:26px;height:26px;fill:none;stroke:var(--vio2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1.5px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:.68rem;color:var(--sub);white-space:nowrap}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--vio2);font-weight:700}
#nav .plus{color:var(--ink)}
#nav .plus i{width:44px;height:44px;margin-top:-20px;border-radius:50%;background:var(--vio);color:#fff;display:grid;place-items:center;border:4px solid var(--card)}
#sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,10,40,.55)}
#sheet .pn{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:4px;max-height:80%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#sheet .in{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--mist);margin:2px 0 6px}
#sheet .h{font-weight:700;padding:0 10px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet button{padding:13px 10px;border-radius:12px;text-align:left}
#sheet button:active{background:var(--lav)}

/* grid playlist */
.plg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:6px 4px 12px}
.pc{min-width:0}.pc .cw{position:relative}
.cv{position:relative;display:block;width:100%;height:0;padding:0 0 100% 0;border-radius:12px;overflow:hidden;background:var(--lav)}
.cv img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.cv svg{position:absolute;left:30%;top:30%;width:40%;height:40%;fill:none;stroke:var(--vio2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.pc .mo{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pc .mo svg{width:18px;height:18px;fill:currentColor}
.pc .tx{display:block;width:100%;text-align:left;margin-top:8px;min-width:0}
.pc .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sb{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd{display:flex;align-items:center;gap:14px;padding:2px 6px 12px}
.phd .cv{width:104px;height:104px;padding:0;flex:none}.phd .sb{font-size:.82rem;color:var(--sub);margin-bottom:8px}
.phd .btn{padding:9px 14px;font-size:.85rem}
.pk{display:flex;flex-direction:column;overflow:auto;max-height:50vh}
.pi{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer}
.pi input{width:20px;height:20px;accent-color:var(--vio);flex:none}
.pi span{display:flex;flex-direction:column;min-width:0}
.pi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pi small{color:var(--sub)}
#sheet .btn{text-align:center;margin-top:8px;color:#fff}
#sheet small{display:block;color:var(--sub);font-weight:400;margin-top:2px}
#sheet button:disabled{opacity:.45}
#sheet .bad{color:var(--bad)}
#sheet svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:middle;margin-right:6px}
#pl{touch-action:pan-y;transition:transform .22s ease}
#pl.col{transform:translateX(105%)}
#pl.gone{display:none}
#pl .art,#pl .cl{display:none}
#pl .cl{color:var(--ink)}
#pl.full{position:fixed;inset:0;z-index:7;border:0;border-radius:0;box-shadow:none;background:var(--mist);padding:calc(env(safe-area-inset-top,0px) + 56px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;justify-content:center;gap:6px;touch-action:auto}
#pl.full .art{display:block;width:min(72vw,300px);aspect-ratio:1;object-fit:contain;margin:0 auto 22px;filter:drop-shadow(0 14px 28px rgba(127,95,208,.35))}
#pl.full .art.cover{object-fit:cover;border-radius:18px}
#pl.full .cl{display:grid;position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px}
#pl.full .n{font-size:1.4rem;white-space:normal}
#pl.full .ar{font-size:1rem;margin-bottom:14px}
#pl.full #pp{width:104px;height:104px}
#pl.full #pp .c{inset:14px}
#edge{position:fixed;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:26px;height:68px;border-radius:16px 0 0 16px;background:var(--vio2);color:#fff;display:grid;place-items:center;z-index:6;touch-action:none;box-shadow:-2px 2px 12px rgba(0,0,0,.25)}
#edge svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#edge.playing{animation:eg 1.4s ease-in-out infinite alternate}
@keyframes eg{from{box-shadow:-2px 2px 12px rgba(0,0,0,.25)}to{box-shadow:-2px 2px 18px 2px rgba(155,127,224,.8)}}
@media(prefers-reduced-motion:reduce){#edge.playing{animation:none}#pl{transition:none}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--mist);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:90%;z-index:9}
.sx{padding:12px;border-radius:16px;background:var(--mist);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.st{font-weight:700;font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.9rem}.sr b{color:var(--vio2);font-size:1.05rem}
.pg{height:10px;border-radius:99px;background:var(--lav);overflow:hidden}
.pg i{display:block;height:100%;width:0;border-radius:99px;background:var(--vio);transition:width .25s}
#sheet .sx .btn{margin-top:0}
#sheet .seg{display:flex;gap:6px}
#sheet .seg button{flex:1;text-align:center;border:1.5px solid var(--line);background:var(--card);padding:11px 6px}
#sheet .seg button.on{background:var(--vio);border-color:var(--vio);color:#fff;font-weight:700}
.ab{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}.ab span{color:var(--sub);white-space:nowrap}.ab b{font-weight:600;text-align:right}
#sheet .sx .lo{text-align:center;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
</style>

const getTheme=()=>{try{const t=localStorage.getItem("essensong-theme");return t==="dark"||t==="light"?t:"auto"}catch(x){return"auto"}};
function setTheme(v){
  try{v==="auto"?localStorage.removeItem("essensong-theme"):localStorage.setItem("essensong-theme",v)}catch(x){}
  v==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",v);
  document.querySelectorAll("#shp .seg button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
}
const sz=s=>s.size||(s.chunks||1)*CH;
function offPct(extra=0){
  const t=songs.reduce((a,s)=>a+sz(s),0);if(!t)return 0;
  const d=songs.reduce((a,s)=>a+(cached.has(s.id)?sz(s):0),0);
  return Math.min(100,Math.floor((d+extra)/t*100));
}
function setUI(){
  const b=$("#dlb");if(!b)return;
  const p=offPct(dl.on?dl.part:0),on=songs.filter(s=>cached.has(s.id)).length,all=songs.length&&on===songs.length;
  b.style.width=p+"%";$("#dlp").textContent=p+"%";
  $("#dls").textContent=!songs.length?"Belum ada lagu di perpustakaan.":dl.on?`Mengunduh lagu ${dl.cur} dari ${dl.n}…`:`${on} dari ${songs.length} lagu tersimpan offline`;
  const bt=$("#dlbtn");bt.textContent=dl.on?"Hentikan unduhan":all?"Semua lagu sudah offline":"Unduh semua lagu";
  bt.disabled=!songs.length||(!dl.on&&!!all);bt.dataset.s=dl.on?"dlstop":"dlall";
}
async function dlAll(){
  if(dl.on)return;
  if(!navigator.onLine)return toast("Perlu internet untuk mengunduh.");
  const me=uid,list=songs.filter(x=>!cached.has(x.id));
  if(!list.length)return toast("Semua lagu sudah tersimpan offline.");
  Object.assign(dl,{on:true,stop:false,n:list.length,cur:0,fail:0,part:0});
  for(const s of list){
    if(dl.stop||uid!==me)break;
    if(cached.has(s.id)){dl.cur++;continue}

  cur=s;realDur=fd;endFired=false;au.src=src;info();render();
  if(fd){applyDur();if(Math.abs(fd-(s.duration||0))>2)updateDoc(doc(db,"users",uid,"songs",s.id),{duration:fd}).catch(()=>{})}
  mp3dur(b).then(d=>{if(tok!==playTok||!d)return;realDur=d;applyDur();if(Math.abs(d-(s.duration||0))>2)updateDoc(doc(db,"users",uid,"songs",s.id),{duration:d}).catch(()=>{})});
  setDoc(doc(db,"users",uid,"songs",s.id),{plays:(s.plays||0)+1,lastPlayed:Date.now()},{merge:true}).catch(()=>{});
  try{await au.play()}catch(x){if(x.name==="NotAllowedError")toast("Ketuk tombol putar untuk memulai.");else if(x.name!=="AbortError")toast("Gagal memutar ("+x.name+"). Ukuran "+(b.size/1048576).toFixed(1)+" MB, awal file: "+await head(b),9000)}
}
let curPl=null;
function coverOf(){
  let p=pls.find(x=>x.id===curPl);
  if(!(p&&p.cover)&&cur)p=pls.find(x=>x.cover&&(x.songIds||[]).includes(cur.id));
  return p&&p.cover?p.cover:""}
function info(){
  bindMS();
  {const a=document.querySelector("#pl .art"),c=cur?coverOf():"";
   if(a){if(c){if(a.getAttribute("src")!==c)a.src=c;a.classList.add("cover")}else{a.classList.remove("cover");if(a.getAttribute("src")!=="icons/logo.png")a.src="icons/logo.png"}}}
  $("#tn").textContent=cur?cur.title:"Belum ada lagu diputar";$("#ta").textContent=cur?cur.artist:"";
  if("mediaSession"in navigator){
    navigator.mediaSession.metadata=cur?new MediaMetadata({title:cur.title,artist:cur.artist||"Essensong",album:"Essensong",artwork:coverOf()?[{src:coverOf(),sizes:"480x480",type:"image/jpeg"}]:[{src:"icons/icon-192.png?v=4",sizes:"192x192",type:"image/png"},{src:"icons/icon-512.png?v=4",sizes:"512x512",type:"image/png"}]}):null}
}
function step(d){
  if(!queue.length)queue=view.map(x=>x.id);
  const i=queue.indexOf(cur&&cur.id);let n;
  if(shuf&&queue.length>1){do n=Math.floor(Math.random()*queue.length);while(n===i)}
  else{n=i+d;if(n>=queue.length){if(rep!==1&&d>0&&!arguments[1])return;n=0}if(n<0)n=queue.length-1}
  play(songs.find(x=>x.id===queue[n]));
}
const toggle=()=>{if(!cur)return view[0]&&(queue=view.map(x=>x.id),play(view[0]));au.paused?au.play():au.pause()};
$("#pp").onclick=toggle;$("#nx").onclick=()=>step(1,true);
$("#pv").onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$("#sh").onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle("act",shuf)};
$("#rp").onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle("act",rep>0);e.currentTarget.title=["Ulangi: mati","Ulangi semua","Ulangi satu lagu"][rep];toast(e.currentTarget.title)};
$("#sk").oninput=e=>{au.currentTime=+e.target.value};
au.onended=()=>{if(sleepSong){setSleep(0);toast("Timer tidur: musik dihentikan.",6000);return}if(rep===2){au.currentTime=0;au.play()}else step(1,rep===1)};
au.onerror=async()=>{
  if(!cur)return;const s=cur;
  if(!healed.has(s.id)&&navigator.onLine){healed.add(s.id);toast("Memperbaiki lagu…",8000);try{await iDel(key(s.id));cached.delete(s.id);await play(s);return}catch(x){}}
  toast("Lagu tidak bisa diputar. Hapus lalu impor ulang.",6000);
};
au.onplay=()=>{bindMS();$("#pl").classList.add("playing");$("#edge").classList.add("playing");$("#pi").innerHTML='<svg viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>';if("mediaSession"in navigator)navigator.mediaSession.playbackState="playing"};
au.onpause=()=>{$("#pl").classList.remove("playing");$("#edge").classList.remove("playing");$("#pi").innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';if("mediaSession"in navigator)navigator.mediaSession.playbackState="paused"};
au.onloadedmetadata=applyDur;
let lp=0;au.ontimeupdate=()=>{
  if(sleepEnd&&Date.now()>=sleepEnd)sleepFire();
  if(realDur&&au.duration&&au.duration-realDur>2){if(au.currentTime<realDur-1)endFired=false;else if(au.currentTime>=realDur-0.15&&!endFired){endFired=true;au.onended();return}}
  $("#sk").value=Math.floor(au.currentTime);$("#cu").textContent=fmt(au.currentTime);
  if("mediaSession"in navigator&&navigator.mediaSession.setPositionState&&durNow()&&Date.now()-lp>1000){lp=Date.now();try{const D=durNow();navigator.mediaSession.setPositionState({duration:D,position:Math.min(au.currentTime,D),playbackRate:1})}catch(x){}}
};

/* ---------- panel pemutar: geser ke tepi, atau layar penuh ---------- */
const pl=$("#pl"),ed=$("#edge");let ps="panel",prevPS="panel",gt;
function setPS(x){
  ps=x;pl.classList.toggle("full",x==="full");
  if(x==="col"){pl.classList.add("col");clearTimeout(gt);gt=setTimeout(()=>{if(ps==="col")pl.classList.add("gone")},240)}
  else{pl.classList.remove("gone");void pl.offsetWidth;pl.classList.remove("col")}
  ed.classList.toggle("hide",x!=="col");
}
const openFull=()=>{if(ps!=="full"){prevPS=ps;setPS("full")}};
$("#cl").onclick=()=>setPS(prevPS==="full"?"panel":prevPS);
let dx0=null,dy0=0,drag=false,sup=false;
pl.addEventListener("pointerdown",e=>{if(ps!=="panel"||e.target.closest("input[type=range]"))return;dx0=e.clientX;dy0=e.clientY;drag=false});
pl.addEventListener("pointermove",e=>{
  if(dx0===null)return;
  if(e.pointerType==="mouse"&&!e.buttons){dx0=null;return}
  const dx=e.clientX-dx0,dy=e.clientY-dy0;
  if(!drag){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){drag=true;pl.setPointerCapture(e.pointerId);pl.style.transition="none"}else return}
  pl.style.transform=`translateX(${Math.max(0,dx)}px)`;
});
const endDrag=e=>{
  if(dx0===null)return;const dx=e.clientX-dx0;dx0=null;
  if(!drag)return;drag=false;sup=true;setTimeout(()=>sup=false,60);
  pl.style.transition="";pl.style.transform="";
  if(e.type==="pointerup"&&dx>90)setPS("col");
};
pl.addEventListener("pointerup",endDrag);pl.addEventListener("pointercancel",endDrag);
pl.addEventListener("click",e=>{if(sup){e.stopPropagation();e.preventDefault()}},true);
pl.addEventListener("click",e=>{if(ps==="panel"&&e.target.closest(".n,.ar"))openFull()});
let ex=null;
ed.addEventListener("pointerdown",e=>{ex=e.clientX;ed.setPointerCapture(e.pointerId)});
ed.addEventListener("pointerup",e=>{if(ex===null)return;const d=e.clientX-ex;ex=null;if(d<-30)setPS("panel");else if(Math.abs(d)<10)openFull()});
ed.addEventListener("pointercancel",()=>{ex=null});
ed.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openFull()}});

/* ---------- kontrol layar kunci / notifikasi (jalan di background) ---------- */
function bindMS(){
  if(!("mediaSession"in navigator))return;
  const m=navigator.mediaSession,h=(a,f)=>{try{m.setActionHandler(a,f)}catch(x){}};
  h("play",()=>au.play());h("pause",()=>au.pause());
  h("previoustrack",()=>$("#pv").click());h("nexttrack",()=>step(1,true));
  /* seek 10 detik dimatikan: kalau terpasang, iOS menampilkan tombol 10 detik menggantikan tombol lagu sebelumnya/berikutnya */
  h("seekbackward",null);h("seekforward",null);
  h("seekto",d=>{au.currentTime=d.seekTime});
}
bindMS();
</script>
